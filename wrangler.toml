# Cloudflare Worker: static pages from ./public (served without running the script: free, unmetered) plus src/worker.js
# for /api/check. No routes or custom domain here: on 1ms.dog the site routes the domain to this Worker. To self-host,
# bind your own domain in the dashboard (see README).
name = "ipqs"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Only the HTML pages run the Worker, so it can write the deploy's ms-* metas into <head>; fonts, scripts and
# images stay on the static path. Without this, Cloudflare serves an existing asset without invoking the script.
run_worker_first = ["/", "/batch/", "/*/", "/*/batch/", "/r/*", "/*/r/*"]

# The /24 portrait and the exact-IP public lists (server/, see server/README.md). Empty turns both off; a fork
# without the service should leave it empty.
[vars]
SEG = "https://seg.1ms.dog:8444"

# Deploy-time measurement endpoints (docs/tool-contract.md §2), set with `wrangler secret put`, never in this file:
#   MS_ANCHORS  "cn=https://<cn>;intl=https://<intl>"  (the page's /conn and /fp anchors)
#   MS_EGRESS   "stun=<host>:<port>;echo=https://<host>:<port>"  (written to <head>; ipqs has no echo reading yet)
# Unset leaves the page's connection cells hidden; the built CSP has no probe hosts.
#
# Fresh lookups per visitor address and minute (cached answers don't count). Remove the block to turn the limit off.
[[ratelimits]]
name = "LIMIT"
namespace_id = "4711"
simple = { limit = 20, period = 60 }

# Optional API keys, each turns on a source (set with `npx wrangler secret put <NAME>`):
#   IPQS_KEY  ABUSEIPDB_KEY  SCAMALYTICS_USER + SCAMALYTICS_KEY (+ SCAMALYTICS_URL)  IPDATA_KEY
#   PROXYCHECK_KEY  IPAPI_IS_KEY  IP2LOCATION_KEY  IPINFO_TOKEN   (raise those sources' free quotas or add fields)
# Cloudflare's human check on the page (a Turnstile widget, managed mode): set both, or the test stays hidden:
#   TURNSTILE_SITEKEY  TURNSTILE_SECRET
