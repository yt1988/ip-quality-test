<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-current="page">
      <span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms"></span>
      <span class="brand-name" data-i="app_name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <a class="icon-btn gh" href="https://github.com/yt1988/ipqs" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <button class="icon-btn" id="theme" type="button" aria-label="Theme">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero card">
      <div class="hero-h">
        <h1>{{h1}}</h1>
        <form class="ask" id="ask" autocomplete="off">
          <label class="sr" for="ipIn" data-i="ph"></label>
          <input id="ipIn" name="ip" type="text" inputmode="text" spellcheck="false" maxlength="45">
          <button class="btn pri" id="go" type="submit" data-i="go"></button>
        </form>
      </div>
      <div class="hero-b">
        <div class="col">
          <div class="score">
            <div class="gauge" id="gauge" data-g="">
              <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="g-bg" cx="60" cy="60" r="52"/><circle class="g-fg" id="gArc" cx="60" cy="60" r="52" pathLength="100"/><g id="gSeg"></g></svg>
              <div class="g-in"><b id="gNum">–</b><span id="gGrade">&nbsp;</span></div>
            </div>
            <div class="verdict">
              <p class="v-h" id="vHead" data-i="checking"></p>
              <p class="v-d" id="vText">&nbsp;</p>
              <p class="parts" id="parts">&nbsp;</p>
            </div>
          </div>
          <div class="sec-h"><span data-i="h_id"></span><button class="mini" id="eye" type="button" data-i="hide"></button></div>
          <ul class="kv" id="facts">
            <li><span data-i="r_ip"></span><b class="ipv"><i class="skl"></i></b></li>
            <li><span data-i="r_loc"></span><b><i class="skl"></i></b></li>
            <li><span data-i="r_net"></span><b><i class="skl"></i></b></li>
            <li><span data-i="r_host"></span><b><i class="skl"></i></b></li>
          </ul>
          <div class="sec-h"><span data-i="mine_h"></span><a class="eg" id="egLink" hidden target="_blank" rel="noopener" data-i="ex_more"></a></div>
          <ul class="exits" id="exList"><li class="xr sk"><i class="skl"></i></li><li class="xr sk"><i class="skl"></i></li></ul>
        </div>
        <div class="col">
          <div class="sec-h"><span data-i="h_finds"></span></div>
          {{finds}}
        </div>
      </div>
      <div class="bar">
        <div class="prog" id="prog"><i></i></div>
        <span class="prog-t" id="progTxt">&nbsp;</span>
        <div class="acts"><button class="btn" id="rerun" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg><span data-i="rerun"></span></button></div>
      </div>
    </section>

    <section class="probes card">
      <h2 data-i="h_src"></h2>
      <div class="pgroups">{{groups}}</div>
    </section>

    <section class="tools-sec">
      <h2 data-i="tools_h"></h2>
      <div class="tools">{{tools}}</div>
    </section>
  </main>
</div>
<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="Previous"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="Next"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>


<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}"></script>
<script src="/assets/{{js}}"></script>
</body>
</html>
